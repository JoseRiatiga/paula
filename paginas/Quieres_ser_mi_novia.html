<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1550">
<title>¿Quieres ser mi novia? 💜</title>
<style>
  :root{
    --violet-deep:#3a1550;
    --violet-mid:#6b3fa0;
    --violet-light:#c9a7f0;
    --petal:#a259d9;
    --petal-2:#e0aaff;
    --gold:#ffd97a;
    --leaf:#3f6b4e;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
  }

  body{
    min-height:100vh;
    min-height:100dvh;
    background:radial-gradient(ellipse at top, #5a2a7a 0%, #3a1550 45%, #23093a 100%);
    font-family:Georgia, 'Times New Roman', serif;
    color:#fdf6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.6;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.85;}
  }

  .petals{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    overflow:hidden;
  }
  .petal-fall{
    position:absolute;
    top:-5vh;
    width:14px;
    height:14px;
    background:linear-gradient(135deg,var(--petal-2),var(--petal));
    border-radius:0 50% 50% 50%;
    opacity:.85;
    animation-name:fall, sway;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes fall{
    to{ transform: translateY(115vh) rotate(340deg); }
  }
  @keyframes sway{
    0%,100%{ margin-left:0; }
    50%{ margin-left:30px; }
  }

  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:480px;
    padding:32px 20px 48px;
    text-align:center;
  }

  .kicker{
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:12px;
    color:var(--violet-light);
    font-family:Verdana, sans-serif;
    margin-bottom:6px;
    opacity:.85;
  }

  h1{
    font-size:28px;
    font-weight:normal;
    margin:0 0 8px;
    color:#fff;
    text-shadow:0 0 18px rgba(200,150,255,.5);
  }

  .subtitle{
    font-style:italic;
    color:var(--violet-light);
    font-size:15px;
    margin:0 0 34px;
  }

  #question-view{
    display:block;
  }

  .buttons{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    flex-wrap:wrap;
    min-height:70px;
  }

  .btn-si{
    background:linear-gradient(135deg,var(--petal-2),var(--petal));
    border:none;
    color:#fff;
    font-family:Georgia, serif;
    font-size:18px;
    padding:16px 34px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(162,89,217,.45);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .btn-si:active{ transform:scale(.96); }

  .btn-no{
    position:fixed;
    background:transparent;
    border:1px solid var(--violet-light);
    color:var(--violet-light);
    font-family:Georgia, serif;
    font-size:15px;
    padding:11px 24px;
    border-radius:999px;
    cursor:pointer;
    transition:left .28s ease, top .28s ease, transform .2s ease;
  }

  .taunt{
    margin-top:20px;
    min-height:20px;
    font-family:Verdana, sans-serif;
    font-size:13px;
    color:var(--violet-light);
    opacity:.85;
    font-style:italic;
  }

  .burst-piece{
    position:fixed;
    left:50%;
    top:50%;
    font-size:20px;
    pointer-events:none;
    z-index:5;
    animation:burst 1.1s ease-out forwards;
  }
  @keyframes burst{
    to{
      transform:translate(var(--dx), var(--dy)) scale(.4) rotate(180deg);
      opacity:0;
    }
  }

  .card{
    display:none;
    margin-top:10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(6px);
    border-radius:18px;
    padding:30px 24px;
    opacity:0;
    transform:translateY(18px) scale(.96);
    transition:opacity .7s ease, transform .7s ease;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .card.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

  .card h2{
    margin:0 0 12px;
    font-size:22px;
    font-weight:normal;
    color:var(--gold);
  }

  .card p{
    font-size:16px;
    line-height:1.7;
    margin:0 0 8px;
    color:#fdf6ff;
  }

  .signature{
    margin-top:14px;
    font-style:italic;
    color:var(--violet-light);
    font-size:14px;
  }

  .back-link{
    display:inline-block;
    margin-top:28px;
    font-family:Verdana, sans-serif;
    font-size:12px;
    letter-spacing:1px;
    color:var(--violet-light);
    text-decoration:none;
    opacity:.75;
  }
  .back-link:hover{ opacity:1; }

</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="petals" id="petals"></div>

<div class="wrap">
  <div class="kicker">una pregunta que llevo guardando</div>
  <h1>¿Quieres ser mi novia?</h1>
  <div class="subtitle">🌸 Solo hay una respuesta correcta 🌸</div>

  <div id="question-view">
    <div class="buttons">
      <button class="btn-si" id="siBtn">Sí 💜</button>
      <button class="btn-no" id="noBtn">No</button>
    </div>
    <div class="taunt" id="taunt"></div>
  </div>

  <div class="card" id="card">
    <h2>💜 Lo sabía 💜</h2>
    <p>Sabía que ibas a decir que sí.</p>
    <p>Gracias por decirle que sí a esto, prometo hacerte muy feliz.</p>
    <div class="signature">— Jose</div>
  </div>

  <a class="back-link" href="../index.html">← Volver al inicio</a>
</div>

<script>
  const starsBox = document.getElementById('stars');
  const STAR_COUNT = 45;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDelay = (Math.random()*3) + 's';
    starsBox.appendChild(s);
  }

  const petalsBox = document.getElementById('petals');
  const PETAL_COUNT = 16;
  for(let i=0;i<PETAL_COUNT;i++){
    const p = document.createElement('div');
    p.className = 'petal-fall';
    p.style.left = Math.random()*100 + 'vw';
    const duration = 7 + Math.random()*7;
    const swayDuration = 2 + Math.random()*2;
    p.style.animationDuration = duration + 's, ' + swayDuration + 's';
    p.style.animationDelay = (Math.random()*8) + 's, 0s';
    p.style.opacity = 0.5 + Math.random()*0.4;
    const scale = 0.6 + Math.random()*0.8;
    p.style.transform = 'scale(' + scale + ')';
    petalsBox.appendChild(p);
  }

  const noBtn = document.getElementById('noBtn');
  const siBtn = document.getElementById('siBtn');
  const taunt = document.getElementById('taunt');
  const questionView = document.getElementById('question-view');
  const card = document.getElementById('card');

  const taunts = [
    '¿Segura? 😏',
    'Inténtalo otra vez',
    'Jaja, no 😝',
    '¡Casi! (no)',
    'El botón "No" no quiere ser encontrado',
    'Ríndete, la respuesta es Sí 💜',
    'Ese botón ya se cansó de correr'
  ];
  let dodgeCount = 0;
  let siScale = 1;

  function placeNoButtonInitial(){
    const rect = noBtn.getBoundingClientRect();
    noBtn.style.left = (window.innerWidth/2 - rect.width/2 + 90) + 'px';
    noBtn.style.top = (window.innerHeight/2 + 60) + 'px';
  }

  function dodge(){
    dodgeCount++;
    const margin = 24;
    const w = noBtn.offsetWidth || 100;
    const h = noBtn.offsetHeight || 44;
    const maxX = Math.max(margin, window.innerWidth - w - margin);
    const maxY = Math.max(margin, window.innerHeight - h - margin);
    const x = margin + Math.random()*(maxX - margin);
    const y = margin + Math.random()*(maxY - margin);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    taunt.textContent = taunts[Math.min(dodgeCount-1, taunts.length-1)];

    if(siScale < 1.5){
      siScale += 0.06;
      siBtn.style.transform = 'scale(' + siScale + ')';
    }
  }

  noBtn.addEventListener('mouseover', dodge);
  noBtn.addEventListener('click', function(e){ e.preventDefault(); dodge(); });
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); dodge(); }, {passive:false});

  window.addEventListener('resize', ()=>{
    if(dodgeCount > 0) dodge();
  });

  function burst(){
    const emojis = ['💜','🌸','✨','💌'];
    for(let i=0;i<20;i++){
      const piece = document.createElement('span');
      piece.className = 'burst-piece';
      piece.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 100 + Math.random()*160;
      piece.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      piece.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      document.body.appendChild(piece);
      setTimeout(()=> piece.remove(), 1150);
    }
  }

  siBtn.addEventListener('click', function(){
    burst();
    questionView.style.display = 'none';
    card.style.display = 'block';
    requestAnimationFrame(()=>{
      card.classList.add('show');
    });
  });

  placeNoButtonInitial();
</script>

</body>
</html>
